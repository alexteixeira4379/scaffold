<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="html-to-img-params" content="w=1080,h=1350">
<!--
  CARD — JOBITO ACTIVATED (pos-pagamento confirmado)
  Placeholders preenchidos pelo compose_presentation do resume_intro:
    first_name -> "Alex"
    summary    -> resumo do acompanhamento ativo
    next_step  -> proximo passo (completar o curriculo)
-->
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{width:1080px;height:1350px;background:#0d2b24;color:#f7fff9;
       font-family:Arial,Helvetica,sans-serif;padding:80px 72px;overflow:hidden;position:relative}
  .brand{font-size:30px;color:#acffb8;letter-spacing:-1px}
  .check{margin-top:120px;width:150px;height:150px;border-radius:50%;
         background:#acffb8;color:#0d2b24;font-size:96px;line-height:150px;text-align:center}
  h1{font-size:78px;line-height:1.05;letter-spacing:-2px;margin:48px 0 10px}
  h1 .accent{color:#acffb8}
  .status{display:inline-block;margin-top:12px;background:#173a30;border:1px solid #2f5e4d;
          color:#acffb8;font-size:26px;padding:14px 26px;border-radius:40px}
  .summary{margin-top:56px;font-size:32px;line-height:1.45;color:#eafff0;max-width:900px}
  .next{position:absolute;left:72px;right:72px;bottom:110px;
        border-left:6px solid #acffb8;padding-left:24px;font-size:28px;color:#eafff0;line-height:1.4}
  .sig{position:absolute;right:72px;bottom:56px;font-size:22px;color:#7fbf93}
</style>
<body>
  <div class="brand">jobito / ativado</div>

  <div class="check">✓</div>

  <h1>Pronto, $first_name.<br>A <span class="accent">Jobito</span><br>está ativa.</h1>
  <div class="status">Pagamento confirmado</div>

  <div class="summary">$summary</div>

  <div class="next">$next_step</div>
  <div class="sig">Jô / Jobito</div>
</body>
</html>
